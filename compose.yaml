services:
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-forkity}:${POSTGRES_PASSWORD:-forkity_dev}@${DATABASE_HOST:-db}:5432/${POSTGRES_DB:-forkity}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      FORKIFY_API_URL: ${FORKIFY_API_URL:-https://forkify-api.jonas.io/api/v2/recipes}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forkity}
      POSTGRES_USER: ${POSTGRES_USER:-forkity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forkity_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: